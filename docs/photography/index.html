<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>张昊天的相册</title>
<meta name="description" content="住在长沙，平时拍拍身边的人，也拍拍路过的风景。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600&family=Caveat:wght@500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <!-- 名字：改这里和 <title> -->
    <a class="logo" href="#top" id="top">张昊天 <small>photo diary</small></a>
    <nav aria-label="页面导航">
      <a href="#album">相册</a>
      <a href="#about">关于</a>
      <a href="#contact">约拍</a>
    </nav>
  </header>

  <section class="intro">
    <span class="hand">hi, 我是张昊天 ——</span>
    <h1>平时拍拍<b>身边的人</b>，<br>也拍拍路过的风景。</h1>
    <p>住在长沙。看到喜欢的光，就按一下快门。</p>
  </section>

  <section id="recent" hidden>
    <div class="label"><h2>最近拍的</h2><span class="hand muted">往右滑 →</span></div>
    <div class="strip" id="strip"></div>
  </section>

  <section class="sec" id="album">
    <div class="sec-head">
      <h2>相册<span class="hand">album</span></h2>
      <div class="tabs" id="tabs" aria-label="按组筛选"></div>
    </div>
    <div class="album" id="albumGrid"><p class="muted">照片加载中…</p></div>
  </section>

  <section class="sec" id="about">
    <div class="about">
      <figure class="polaroid">
        <img src="photos/about.jpg" alt="张昊天坐在山崖边" loading="lazy">
        <span class="hand">这是我 :)</span>
      </figure>
      <div class="about-text">
        <h2>关于我</h2>
        <p>住在长沙，平时拿着相机到处走走。喜欢自然光，喜欢树荫下斑驳的光，也喜欢人在放松时候的样子。</p>
        <p>拍人像不太会摆姿势，通常就是边聊天边拍。</p>
      </div>
    </div>
  </section>

  <section class="contact" id="contact">
    <div>
      <h2>想一起拍点照片？</h2>
      <p>朋友约拍、毕业照、日常写真都可以，长沙周边周末有空。加微信聊聊就好。</p>
    </div>
    <!-- 联系方式：把“待填写”换成真实的账号；不想公开的那一行整行删掉 -->
    <div class="ids">
      <div class="id"><span>微信</span><code id="wx">待填写</code><button type="button" data-copy="wx">复制</button></div>
      <div class="id"><span>小红书</span><code id="xhs">待填写</code><button type="button" data-copy="xhs">复制</button></div>
    </div>
  </section>

  <footer><span>© <span id="year">2026</span> 张昊天 · 照片版权归作者所有</span><span class="hand">thanks for looking :)</span></footer>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="查看照片">
  <div class="lb-bar">
    <span id="lbCount"></span>
    <div>
      <button type="button" id="lbPrev" aria-label="上一张">←</button>
      <button type="button" id="lbNext" aria-label="下一张">→</button>
      <button type="button" id="lbClose">关闭</button>
    </div>
  </div>
  <div class="lb-stage"><div class="ph"><img id="lbImg" alt=""><span class="stamp" id="lbStamp"></span></div></div>
  <div class="lb-cap"><span class="hand" id="lbTitle"></span><span class="muted" id="lbMeta"></span></div>
</div>

<script src="app.js"></script>
</body>
</html>
